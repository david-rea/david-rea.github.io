short_bio: >-
  <p>
    I am a Ph.D. level astrophysicist with expertise in fluid dynamics, plasma physics, and high-performance computational computational modeling.
    I design numerical experiments of physical problems, run massively-parallelized simulations on NSF and NASA supercomputers, 
    and perform statistical and signal analyses on simulation results.
  </p>
  <p>
    I recieved my B.S. in Physics from George Mason University in 2019 and my Ph.D. in Astrophysics studying with Dr. Jacob Simon at Iowa State 
    University in 2026. In 2024 I was selected to recieve a NASA FINESST Fellowship, a highly competitive research grant that funded a self-designed and 
    led project investigating planet formation processes in astrophysical accretion disks.
  </p>

